<style>
:root{
  --ink:#17130c; --sub:#6d675c; --line:#e9e4d8; --line2:#dcd4c3; --bg:#ffffff; --bg2:#f7f6f1; --bg3:#f0eee6;
  --brand:#FF5C1A; --brand-dark:#e8480c; --brand-soft:#fff1e8; --amber:#ffb03a;
  --brand-grad:linear-gradient(135deg,#ff7d2e 0%,#ff5c1a 52%,#f43d0a 100%);
  --shadow-sm:0 1px 2px rgba(23,18,8,.05),0 2px 8px -2px rgba(23,18,8,.06);
  --shadow:0 2px 4px rgba(23,18,8,.04),0 18px 44px -14px rgba(23,18,8,.16);
  --shadow-lg:0 4px 10px rgba(23,18,8,.05),0 36px 72px -20px rgba(23,18,8,.26);
  --shadow-brand:0 10px 22px -8px rgba(255,92,26,.5);
  --ring:0 0 0 4px rgba(255,92,26,.16);
  --ease:cubic-bezier(.22,.68,.26,1);
  --brand-grad:linear-gradient(135deg,#ff7d2e 0%,#ff5c1a 52%,#f43d0a 100%);
  --line2:#dcd4c3; --bg3:#f0eee6; --amber:#ffb03a;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans JP","Noto Sans KR",Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;display:flex}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.mascot{display:inline-block;flex:none}
.mascot svg{display:block}

/* ---------- 侧边栏 ---------- */
aside{width:264px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;height:100vh;position:sticky;top:0}
.logo{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800;padding:2px 6px 14px}
.newchat{display:flex;align-items:center;gap:8px;background:#141414;color:#fff;border:none;border-radius:12px;padding:11px 14px;font-size:14.5px;font-weight:650;width:100%}
.newchat:hover{background:var(--brand)}
.histlabel{font-size:12px;color:var(--sub);font-weight:700;margin:20px 6px 8px}
.hist{display:flex;flex-direction:column;gap:3px}
.hist a{padding:9px 11px;border-radius:10px;font-size:14px;color:#3d3b36;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist a:hover{background:#fff}
.hist a.on{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:13px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffb59e,#FF5C1A);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.side-foot b{font-size:14px;display:block}
.side-foot span{font-size:12px;color:var(--sub)}
.langsel{position:relative;margin-top:12px}
.langsel select{appearance:none;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 26px 8px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.langsel::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--sub);pointer-events:none}

/* ---------- 主区 ---------- */
main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
.topbar{height:52px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;background:#fff}
.modelpick{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:650;background:var(--bg2);border-radius:999px;padding:7px 14px}
.modelpick select{border:none;background:transparent;font:inherit;color:inherit;cursor:pointer;outline:none}
.trybox{margin-top:28px}
.trybox .tl{font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:10px}
.trychips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.trychip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;color:#3d3b36}
.trychip:hover{border-color:var(--brand);color:var(--brand)}
.demobadge{background:var(--brand-soft);color:var(--brand-dark);border:1px solid #ffd9c7;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 12px}
.topbar .note{color:var(--sub);font-size:12.5px}
.msgs{flex:1;overflow-y:auto;padding:28px 20px 12px}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column}
.welcome{text-align:center;padding:52px 10px 8px}
.welcome h1{font-size:30px;font-weight:850;letter-spacing:-.01em}
.welcome p{color:var(--sub);margin-top:10px;font-size:15.5px}
.msg-u{align-self:flex-end;background:#141414;color:#fff;border-radius:18px 18px 4px 18px;padding:12px 16px;max-width:80%;font-size:15.5px;margin-top:22px;white-space:pre-wrap;word-break:break-word}
.msg-a{margin-top:22px;max-width:92%}
.steps{border:1px solid var(--line);border-radius:14px;padding:6px 16px;max-width:520px;background:#fff}
.steps .s-head{font-size:13px;color:var(--sub);font-weight:700;padding:8px 0 4px}
.step{display:flex;gap:9px;align-items:center;padding:7px 0;font-size:14.5px;color:#3d3b36;opacity:0;transform:translateY(4px);transition:.3s}
.step.show{opacity:1;transform:none}
.step .tick{width:19px;height:19px;flex:none;border-radius:50%;border:2px solid #d8d5cd;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.step.done .tick{background:#2f9e63;border-color:#2f9e63}
.a-text{margin-top:14px;font-size:15.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.filecard{margin-top:14px;display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:14px;padding:13px 16px;max-width:460px;background:#fff;box-shadow:0 4px 16px rgba(20,16,8,.05)}
.filecard .fic{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.filecard b{font-size:15px;display:block}
.filecard span{color:var(--sub);font-size:13px}
.filecard .dl{margin-left:auto;flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.filecard .dl:hover{border-color:var(--brand);color:var(--brand)}
.preview{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:640px}
.preview .pv-head{background:var(--bg2);font-size:12.5px;color:var(--sub);font-weight:700;padding:8px 14px;border-bottom:1px solid var(--line)}
.preview iframe{width:100%;height:340px;border:none;display:block;background:#fff}
.imgcard{margin-top:14px;max-width:460px;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;color:#fff}
.imgcard .ph{height:250px}
.imgcard .ph svg{width:100%;height:100%;display:block}
.filecard .fic.badge{font-size:10.5px;font-weight:800;letter-spacing:.02em;color:#fff}
.imgcard .cap{position:absolute;left:14px;bottom:12px;font-weight:750;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.imgcard .tag{position:absolute;top:10px;right:10px;background:rgba(15,15,15,.55);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.costnote{margin-top:12px;font-size:12.5px;color:#a09d94}
.typing{display:inline-flex;gap:5px;margin-top:16px}
.typing i{width:7px;height:7px;border-radius:50%;background:#c9c6bd;animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* ---------- 输入区 ---------- */
.inputzone{flex:none;padding:10px 20px 20px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 26%)}
.inputcol{max-width:820px;margin:0 auto}
.modechips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.chip{border:1px solid transparent;background:var(--bg2);color:#3d3b36;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:#141414;color:#fff}
.chip.free{background:#fff;border-color:var(--line)}
.chip.free.on{background:#141414;color:#fff}
.composer{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px 10px}
.composer textarea{width:100%;border:none;resize:none;font-family:inherit;font-size:16px;line-height:1.5;min-height:46px;outline:none;color:var(--ink);background:transparent}
.composer textarea::placeholder{color:#a9a69d}
.composer .tools{display:flex;align-items:center;gap:10px}
.plusbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:19px;line-height:1;color:#44423c}
.plusbtn:hover{border-color:var(--brand);color:var(--brand)}
.sendbtn{margin-left:auto;width:40px;height:40px;border-radius:50%;border:none;background:#141414;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.sendbtn:hover{background:var(--brand)}
.sendbtn:disabled{opacity:.35;cursor:default}
.hint{text-align:center;color:#a09d94;font-size:12px;margin-top:10px}
@media(max-width:820px){ aside{display:none} .msg-u{max-width:92%} }

/* ============ Poko Design System v2 · 视觉升级层 ============ */
::selection{background:#ffd7c2;color:#7a2400}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
aside{background:linear-gradient(180deg,#faf9f5,#f3f1ea)}
.newchat{background:linear-gradient(135deg,#2b251b,#141210);box-shadow:var(--shadow-sm);transition:all .18s var(--ease)}
.newchat:hover{background:var(--brand-grad);box-shadow:var(--shadow-brand);transform:translateY(-1px)}
.hist a{transition:background .15s}
.hist a.on{border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.topbar{background:rgba(255,255,255,.86);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6)}
.modelpick{border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-sm)}
.welcome h1{letter-spacing:-.02em}
.msg-u{background:linear-gradient(135deg,#2b251b,#141210);box-shadow:var(--shadow-sm)}
.composer{transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:var(--brand);box-shadow:var(--shadow-lg),var(--ring)}
.sendbtn{background:var(--brand-grad);box-shadow:var(--shadow-brand);transition:transform .18s var(--ease),filter .18s,box-shadow .18s}
.sendbtn:hover{background:var(--brand-grad);filter:brightness(1.06);transform:scale(1.07)}
.sendbtn:active{transform:scale(.95)}
.sendbtn:disabled{background:#141414;box-shadow:none}
.plusbtn{transition:all .18s var(--ease)}
.plusbtn:active{transform:scale(.92)}
.filecard{transition:all .2s var(--ease)}
.filecard:hover{border-color:#f0cdb2;box-shadow:var(--shadow);transform:translateY(-1px)}
.steps{box-shadow:var(--shadow-sm)}
.imgcard{box-shadow:var(--shadow)}
.preview{box-shadow:var(--shadow-sm)}
.chip{transition:all .18s var(--ease)}
.chip:hover{transform:translateY(-1px)}
.chip.on{box-shadow:var(--shadow-sm)}
.trychip{transition:all .18s var(--ease)}
.trychip:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.typing i:nth-child(2){background:var(--brand)}
.msgs{scrollbar-width:thin;scrollbar-color:#d8d2c4 transparent}
.msgs::-webkit-scrollbar{width:8px}
.msgs::-webkit-scrollbar-thumb{background:#ddd6c8;border-radius:8px}
.langsel select{transition:border-color .18s,box-shadow .18s}
.langsel select:focus{border-color:var(--brand);box-shadow:var(--ring);outline:none}
.demobadge{box-shadow:var(--shadow-sm)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<style id="r7">
/* ===== 第七轮：继续追问 / 快捷键提示 / NEW 角标 ===== */
.furow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.fulab{font-size:12.5px;color:var(--sub);font-weight:600;margin-right:2px}
.fuchip{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),border-color .2s,color .2s}
.fuchip:hover{border-color:var(--brand);color:var(--brand-dark);transform:translateY(-1px)}
.kbhint{margin:6px 2px 0;font-size:12px;color:var(--sub);opacity:.72;text-align:center}
.newb{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--brand-grad);color:#fff;font-size:9.5px;font-style:normal;font-weight:800;letter-spacing:.08em;vertical-align:2px}
/* ===== 第十一轮：真实模式徽章（绿） ===== */
.demobadge.real{background:#e7f6ee;color:#177245;border-color:#bfe6cf}
</style>
<style id="r13">
/* 第十三轮：附件缩略图条 / 用户气泡图片 / 生成图渲染 */
.attachbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.attachbar[hidden]{display:none}
.attchip{position:relative;display:inline-block;line-height:0}
.attchip img{width:52px;height:52px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.attx{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;line-height:1;cursor:pointer;padding:0}
.uimgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.uimgs img{width:110px;height:110px;object-fit:cover;border-radius:10px;display:block}
.genimg{margin-top:14px;max-width:460px}
.genimg img{width:100%;display:block;border-radius:16px;border:1px solid var(--line)}
.genimg video{width:100%;display:block;border-radius:16px;border:1px solid var(--line);background:#000}
.vidnote{margin-top:10px;font-size:12.5px;color:var(--sub)}
.genimg .dl{display:inline-block;margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none}
.genimg .dl:hover{border-color:var(--brand);color:var(--brand)}
.genimg .cap{margin-top:8px;font-size:13px;color:var(--sub)}
</style>
<style id="r14">
/* ===== 修复2：文档附件 chip / 气泡内附件 / csv→xlsx 下载按钮 ===== */
.docchip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.3;box-shadow:var(--shadow-sm)}
.docchip b{font-weight:700;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docchip .docmeta{color:var(--sub);white-space:nowrap}
.docchip .attx{position:static;flex:none}
.udocs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.udoc{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:5px 9px;font-size:12px;line-height:1.3;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25)}
.udoc b{font-weight:700;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.udoc span{opacity:.75;white-space:nowrap}
.csvdl{margin-top:12px}
.dlbtn{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.dlbtn:hover{border-color:var(--brand);color:var(--brand)}
.codeout{margin-top:10px;max-width:640px;background:#17130c;color:#e8e2d4;border-radius:12px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
</style>
</head>

// 从模型回复文本里提取图片，四种形式：
//   ① Markdown 图片 + data URI（图生图 nano-banana-pro 的实际返回：![Generated image 1](data:image/jpeg;base64,…)）
//   ② Markdown 图片 + http(s) URL
//   ③ 裸 http(s) 图片 URL
//   ④ 裸 data URI
// 返回 {urls, images:[{src, alt, ext}], cleaned}：cleaned 里不残留任何图片数据（含 base64 长串），
// alt 文本保留在 images[].alt 里，由 addReplyImage 渲染为图片说明。urls 为 src 列表（兼容旧调用）。
function extractReplyImages(full){
  const images = [];
  const dataUriRe = "data:image\\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+";
  const extOf = src => {
    const m = /^data:image\/([a-zA-Z0-9.+-]+);/.exec(src);
    if(m){ const st = m[1].toLowerCase(); return st === "jpeg" ? "jpg" : st; }
    return "jpg"; // http(s) 成品图沿用旧口径
  };
  const push = (src, alt) => { images.push({src, alt: alt || "", ext: extOf(src)}); };
  let cleaned = full
    .replace(new RegExp("!\\[([^\\]]*)\\]\\((" + dataUriRe + ")\\)", "g"),
      (m, alt, u) => { push(u, alt); return ""; })
    .replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,
      (m, alt, u) => { push(u, alt); return ""; });
  cleaned = cleaned.replace(/(^|\s)(https?:\/\/[^\s)]+?\.(?:png|jpe?g|webp|gif))(?=\s|$)/gi,
    (m, pre, u) => { push(u, ""); return pre; });
  cleaned = cleaned.replace(new RegExp(dataUriRe, "g"),
    m => { push(m, ""); return ""; });
  return {urls: images.map(im => im.src), images, cleaned: cleaned.trim()};
}

function normalizePptData(raw){
  if(!raw || typeof raw !== "object") return null;
  const title = typeof raw.title === "string" ? raw.title.trim() : "";
  if(!Array.isArray(raw.slides)) return null;
  const slides = [];
  for(const s of raw.slides){
    if(!s || typeof s !== "object") continue;
    const st = typeof s.title === "string" ? s.title.trim() : "";
    const bullets = Array.isArray(s.bullets)
      ? s.bullets.map(b => String(b == null ? "" : b).trim()).filter(Boolean).slice(0, 12)
      : [];
    if(st || bullets.length) slides.push({title: st || "—", bullets});
    if(slides.length >= 30) break;
  }
  if(!slides.length) return null;
  return {title: title || slides[0].title, slides};
}
function extractPptBlocks(text){
  const out = [];
  const re = /```ppt\s*\r?\n([\s\S]*?)```/gi;
  let m;
  while((m = re.exec(text)) !== null){
    try{
      const data = normalizePptData(JSON.parse(m[1].trim()));
      if(data) out.push(data);
    }catch(e){ /* JSON 不合法：不显示按钮，原文保留在回复中，不吞内容 */ }
  }
  return out;
}
function pptDataToMd(data){
  return "# " + data.title + "\n\n" + data.slides.map((s, i) =>
    "## " + (i + 1) + ". " + s.title + "\n" + s.bullets.map(b => "- " + b).join("\n")
  ).join("\n\n") + "\n";
}
function downloadPptMd(data){
  const blob = new Blob([pptDataToMd(data)], {type: "text/markdown;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "poko-presentation-outline.md";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
/* PptxGenJS 生成 16:9 .pptx：封面（大标题 + Poko 副标）+ 内容页（品牌橙标题 + 装饰条 + 项目符号正文） */
async function generatePptx(data){
  const pptx = new PptxGenJS();

  pptx.layout = "POKO_WIDE";
  const RECT = (pptx.ShapeType && pptx.ShapeType.rect) || (pptx.shapes && pptx.shapes.RECTANGLE) || "rect";
  const BRAND = "F43D0A", INK = "26221E", SUB = "6D675C";
  const cover = pptx.addSlide();
  cover.background = {color: "FFFFFF"};

/* 提取回复里指定语言的代码块：lang 归一化（javascript→js），返回 [{lang, code}] */
function extractCodeBlocks(text, langs){
  const out = [];
  const re = /```([a-zA-Z0-9+#.-]*)\s*\r?\n([\s\S]*?)```/g;
  let m;
  while((m = re.exec(text)) !== null){
    let lg = (m[1] || "").toLowerCase();
    if(lg === "javascript") lg = "js";
    if(langs.includes(lg) && m[2].trim()) out.push({lang: lg, code: m[2].replace(/\s+$/, "")});
  }
  return out;
}

/* 跑代码模式：```js 块在 sandboxed iframe 里真执行。
   harness（第一个 <script>）覆写 console.log/error/warn → postMessage 回传；
   用户代码放第二个 <script>（含语法错误时 harness 的收尾计时器仍能回报）；
   window.onerror 收集运行时/语法错误；600ms 后发 done（兼顾异步 log），父页 5 秒超时兜底。
   sandbox 只有 allow-scripts、没有 allow-same-origin：代码在不透明源里跑，碰不到本站任何东西。 */
function runJsSandboxed(code){
  return new Promise(resolve => {
    const id = "poko" + Math.random().toString(36).slice(2, 10);
    const logs = [];
    let settled = false;
    const fr = document.createElement("iframe");
    fr.setAttribute("sandbox", "allow-scripts");
    fr.style.display = "none";
    function finish(err){
      if(settled) return; settled = true;
      window.removeEventListener("message", onMsg);
      fr.remove();
      resolve({logs, error: err || null});
    }
    function onMsg(e){
      const d = e.data;
      if(!d || d.__pokoRun !== id) return;
      if(d.type === "log") logs.push(d.text);
      else if(d.type === "done") finish(d.error || null);
    }
    window.addEventListener("message", onMsg);
    const harness =
      "var __err=null;" +
      "function __fmt(a){return a.map(function(x){if(typeof x==='string')return x;try{return JSON.stringify(x)}catch(e){return String(x)}}).join(' ')}" +
      "console.log=function(){parent.postMessage({__pokoRun:" + JSON.stringify(id) + ",type:'log',text:__fmt([].slice.call(arguments))},'*')};" +
      "console.error=console.log;console.warn=console.log;" +
      "window.onerror=function(m){if(__err===null)__err=String(m)};" +
      "setTimeout(function(){parent.postMessage({__pokoRun:" + JSON.stringify(id) + ",type:'done',error:__err},'*')},600);";
    const safe = code.replace(/<\/script/gi, "<\\/script");
    fr.srcdoc = "<!doctype html><meta charset='utf-8'><script>" + harness + "<\/script><script>" + safe + "<\/script>";
    document.body.appendChild(fr);
    setTimeout(() => finish(null), 5000);
  });
}

}
// 附件图片真读：FileReader 读为 data URL，再用 canvas 压到最长边 ≤1024（格式保持 png/jpeg，quality 0.85）
function readImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const raw = reader.result;
      const img = new Image();
      img.onload = () => {
        try{
          const MAX = 1024;
          const scale = Math.min(1, MAX / Math.max(img.width, img.height));
          if(scale >= 1){ resolve(raw); return; }
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", 0.85));
        }catch(e){ resolve(raw); }
      };
      img.onerror = () => resolve(raw);
      img.src = raw;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ================= 修复2：表格 / 文本附件真解析 =================
   表格（xlsx/xls/csv）经 SheetJS 解析为 CSV 文本；文本（txt/md/json）直接读正文。
   单文件正文上限约 12000 字符，超出截断并在末尾注明。解析结果只进待发送区，不落盘。 */
const ATTACH_TEXT_LIMIT = 12000;
const ATTACH_MAX_BYTES = 5 * 1024 * 1024;
function capAttachText(text){
  if(text.length <= ATTACH_TEXT_LIMIT) return {text, truncated: false};
  return {text: text.slice(0, ATTACH_TEXT_LIMIT) + "\n" + t("trunc_note"), truncated: true};
}
function csvEscapeCell(v){
  const s = v === null || v === undefined ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function docMetaText(doc){
  if(doc.kind === "sheet") return t("attach_sheet_meta").replace("{sheets}", doc.sheets).replace("{rows}", doc.rows);
  if(doc.kind === "text") return t("attach_text_meta").replace("{lines}", doc.lines);
  return t("attach_unparsed_meta");
}
async function parseSpreadsheetFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type: "array"});
  const parts = [];
  let totalRows = 0;
  for(const sn of wb.SheetNames){
    const ws = wb.Sheets[sn];
    if(!ws) continue;
    const aoa = XLSX.utils.sheet_to_json(ws, {header: 1, raw: false, defval: ""});
    // 去掉尾部整行空白，避免格式撑大的空行灌进上下文
    while(aoa.length && aoa[aoa.length - 1].every(c => c === "")) aoa.pop();
    if(!aoa.length) continue;
    const rows = aoa.slice(0, 200).map(r => r.slice(0, 30));
    totalRows += rows.length;
    parts.push("## " + sn + "\n" + rows.map(r => r.map(csvEscapeCell).join(",")).join("\n"));
  }
  const capped = capAttachText(parts.join("\n\n"));
  return {name: file.name, kind: "sheet", text: capped.text,
          sheets: parts.length, rows: totalRows, truncated: capped.truncated};
}
function readTextAttach(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const capped = capAttachText(String(reader.result || ""));
      resolve({name: file.name, kind: "text", text: capped.text,
               lines: capped.text ? capped.text.split("\n").length : 0, truncated: capped.truncated});
    };
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

/* ================= 真实 API 模式（POKO_API_BASE 非空时） ================= */
function apiPayload(modelOverride, sysKey){
  let msgs = historyMsgs;
  // 修复2：分析表格模式给该次请求附加 system 指令，要求表格结果以 ```csv 代码块输出（前端据此给真 xlsx 下载）
  if(currentMode === "sheet") msgs = [{role: "system", content: t("sheet_sys")}].concat(historyMsgs);
  // 修复3：做PPT 模式给该次请求附加 system 指令，要求演示内容以 ```ppt 代码块输出严格 JSON（前端据此生成真 .pptx）
  if(currentMode === "ppt") msgs = [{role: "system", content: t("ppt_sys")}].concat(historyMsgs);
  // 修复4：写报告 / 跑代码模式同款注入（结构化 Markdown 报告 / 单一语言代码块），同样只附加于该次请求、不入 history
  if(currentMode === "report") msgs = [{role: "system", content: t("report_sys")}].concat(historyMsgs);
  if(currentMode === "code") msgs = [{role: "system", content: t("code_sys")}].concat(historyMsgs);
  // 修复4：网页意图（自由模式下关键词命中 web）由 runAPI 传入 sysKey="web_sys"，该次请求附加网页 system
  if(sysKey) msgs = [{role: "system", content: t(sysKey)}].concat(historyMsgs);
  const p = {messages: msgs};
  const m = modelOverride !== undefined ? modelOverride : currentModel;
  if(m) p.model = m; // 智能优选不传，后端用默认型号
  return p;
}
/* opts: {model, content, renderImages}
   model/content 缺省 = 沿用所选模型与纯文本；content 可为多模态 parts 数组（视觉/图生图）；
   renderImages=true 时把回复里的图片 URL 提取出来渲染成 <img>（图生图 nano-banana-pro 用） */
async function runAPI(text, opts){
  opts = opts || {};
  const model = opts.model !== undefined ? opts.model : currentModel;
  // 修复4：记录发送瞬间的模式（回复后处理据此挂报告下载）；自由模式下命中网页意图时该次请求附加 web_sys
  const modeUsed = currentMode;
  const extraSys = (modeUsed === "free" && detectIntent(text) === "web") ? "web_sys" : null;
  lastUsedModelId = model || BACKEND_DEFAULT_MODEL;
  historyMsgs.push({role:"user", content: opts.content || text});
  const wrap = addAgentShell();
  const body = document.createElement("div");
  body.className = "a-text";
  try{
    const res = await fetch(POKO_API_BASE.replace(/\/+$/,"") + "/api/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(apiPayload(model, extraSys))
    });
    if(!res.ok || !res.body) throw new Error("bad response");
    wrap.innerHTML = ""; wrap.appendChild(body);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", full = "";
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for(const line of lines){
        const s = line.trim();
        if(!s.startsWith("data:")) continue;
        const data = s.slice(5).trim();
        if(data === "[DONE]") continue;
        try{
          const j = JSON.parse(data);
          const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if(delta){
            full += delta;
            // 含图片数据的回复（图生图）：base64 长串收完前不刷原文，先显示生成占位，完成后整体渲染
            body.textContent = (opts.renderImages && /data:image|!\[Generated image/.test(full)) ? t("img_generating") : full;
            scrollBottom();
          }
        }catch(e){ /* 忽略不完整的 SSE 分片 */ }
      }
    }
    if(!full) throw new Error("empty stream");
    historyMsgs.push({role:"assistant", content:full});
    if(opts.renderImages){
      const ex = extractReplyImages(full);
      if(ex.images.length){
        body.textContent = ex.cleaned;
        ex.images.forEach((im, i) => addReplyImage(wrap, proxiedImgSrc(im.src), "poko-image-" + (i + 1) + "." + im.ext, im.alt));
      }else{
        body.textContent = full; // 流式期若显示过生成占位，这里恢复全文
      }
    }
    // 修复2：回复里的 ```csv 代码块下方给出真 xlsx 下载（SheetJS 缺失时降级为 .csv 原文）
    addCsvDownloads(wrap, full);
    // 修复3：回复里的 ```ppt 代码块（严格 JSON）下方给出真 .pptx 下载（PptxGenJS 缺失时降级为导出大纲 .md 并如实标注）
    addPptDownloads(wrap, full);
    // 修复4：写报告模式给该条回复挂「下载报告 (.md)」，内容为该条回复的 Markdown 原文
    if(modeUsed === "report") addReportDownload(wrap, full);
    // 修复4：回复里的 ```html 代码块下方给真预览（sandboxed iframe）+「下载网页 (.html)」
    addHtmlBlocks(wrap, full);
    // 修复4：回复里的 ```js 代码块下方给「运行」按钮（sandboxed iframe 真执行并回显 console 输出）
    addJsRuns(wrap, full);
  }catch(e){
    // 请求失败 → 回退演示模式，保证体验不断
    historyMsgs.pop();
    wrap.remove();
    await runDemo(text);
    return;
  }
  addCostNote(wrap, "api");
  addFollowUps(wrap, detectIntent(text));
  scrollBottom();
}

/* 文生图：图像生成模式且无附件时走 Worker /api/image（默认 InitAPI gpt-image-2，非流式）。
   真实出图要 30–90 秒：占位文案先行、发送按钮由 send() 的 busy 锁禁用；失败回退演示并如实标注。 */
async function runImageGen(text){
  const wrap = addAgentShell();
  const ph = document.createElement("div");
  ph.className = "a-text"; ph.textContent = t("img_generating");
  wrap.innerHTML = ""; wrap.appendChild(ph); scrollBottom();
  try{
    const res = await fetch(POKO_API_BASE.replace(/\/+$/,"") + "/api/image", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({prompt: text})
    });
    if(!res.ok) throw new Error("image request failed");
    const j = await res.json();
    const src = j && (j.data_url || j.url);
    if(!src) throw new Error("no image in response");
    lastUsedModelId = j.model || "gpt-image-2";
    ph.remove();
    addReplyImage(wrap, proxiedImgSrc(src), "poko-image.png");
  }catch(e){
    wrap.remove();
    await runDemo(text);
    return;
  }
  addCostNote(wrap, "api");
  addFollowUps(wrap, "media");
  scrollBottom();
}

/* 生成视频：视频模式走 Worker /api/video 异步任务（A6 doubao-seedance-2.5）。
   创建任务 → 每 15 秒轮询 GET /api/video?id=，最长等 7 分钟；等待态复用图像的
   .a-text 占位样式，文案为视频版并每秒刷新已等待秒数（上游进度只有 0/50/100
   三档，有进度时一并显示，不做平滑假进度）。成功后渲染 <video> + 下载链接，
   注脚记真实型号；失败/超时回退演示并按演示规则如实标注。
   本轮不支持图生视频：带图片附件时忽略图片，并在气泡下小字如实提示。
   轮询是异步等待，期间页面可正常浏览；防重复提交沿用 send() 的 busy 锁。 */
async function runVideoGen(text, hasImages){
  const wrap = addAgentShell();
  wrap.innerHTML = "";
  if(hasImages){
    const note = document.createElement("div");
    note.className = "vidnote"; note.textContent = t("vid_img_ignored");
    wrap.appendChild(note);
  }
  const ph = document.createElement("div");
  ph.className = "a-text";
  wrap.appendChild(ph); scrollBottom();
  const started = Date.now();
  let progress = 0;
  const paint = () => {
    const s = Math.floor((Date.now() - started) / 1000);
    ph.textContent = t("vid_generating").replace("{s}", s) +
      (progress > 0 ? t("vid_progress").replace("{p}", progress) : "");
  };
  paint();
  const timer = setInterval(paint, 1000);
  try{
    const base = POKO_API_BASE.replace(/\/+$/, "");
    const res = await fetch(base + "/api/video", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({prompt: text})
    });
    if(!res.ok) throw new Error("video create failed");
    const cj = await res.json();
    const taskId = cj && cj.task_id;
    if(!taskId) throw new Error("no task id");
    let videoUrl = null;
    while(Date.now() - started < 7 * 60 * 1000){
      await wait(15000);
      const sr = await fetch(base + "/api/video?id=" + encodeURIComponent(taskId));
      if(!sr.ok) continue; // 单次轮询失败不中断，继续等到总超时
      const sj = await sr.json().catch(() => null);
      if(!sj || !sj.ok) continue;
      if(typeof sj.progress === "number") progress = sj.progress;
      paint();
      if(sj.status === "succeeded" && sj.video_url){ videoUrl = sj.video_url; break; }
      if(sj.status === "failed") throw new Error("video task failed");
    }
    if(!videoUrl) throw new Error("video timeout");
    clearInterval(timer);
    lastUsedModelId = "doubao-seedance-2.5";
    ph.remove();
    const card = document.createElement("div");
    card.className = "genimg";
    const v = document.createElement("video");
    v.controls = true; v.playsInline = true;
    v.src = base + videoUrl;
    card.appendChild(v);
    const a = document.createElement("a");
    a.href = base + videoUrl; a.download = "poko-video.mp4";
    a.className = "dl"; a.textContent = t("vid_dl");
    card.appendChild(a);
    wrap.appendChild(card);
  }catch(e){
    clearInterval(timer);
    wrap.remove();
    await runDemo(text);
    return;
  }
  addCostNote(wrap, "api");
  addFollowUps(wrap, "media");
  scrollBottom();
}

/* ================= 发送流程 ================= */
async function send(){
  if(busy) return;
  const input = $("#input");
  const text = input.value.trim();
  if(!text) return;
  const images = pendingImages.slice(); // 本条消息携带的图片（发送即消费）
  const docs = pendingDocs.slice(); // 修复2：本条消息携带的文档附件（发送即消费）
  busy = true; $("#sendBtn").disabled = true;
  input.value = "";
  pendingImages = []; pendingDocs = []; renderAttachBar(); $("#attachName").textContent = "";
  addUserMsg(text, images, docs);
  // 修复2：文档解析文本并入本条消息正文（真实模式进 history；演示回退只看原文与气泡 chip）
  let mergedText = text;
  if(docs.length){
    const blocks = docs.map(doc => doc.kind === "unparsed"
      ? t("attach_unparsed_line").replace("{name}", doc.name)
      : t("attach_label").replace("{name}", doc.name) + "\n" + doc.text);
    mergedText = text + "\n\n" + blocks.join("\n\n");
  }
  try{
    if(POKO_API_BASE){
      if(currentMode === "image" && images.length){
        // 图生图：nano-banana-pro（A6），图片以 image_url parts 随消息发送，回复图片提取渲染
        const parts = [{type:"text", text: mergedText}].concat(images.map(im => ({type:"image_url", image_url:{url: im.dataUrl}})));
        await runAPI(text, {model:"nano-banana-pro", content: parts, renderImages: true});
      } else if(currentMode === "image"){
        // 文生图：/api/image（gpt-image-2）
        await runImageGen(text);
      } else if(currentMode === "video"){
        // 生成视频：/api/video 异步任务链路（本轮不使用图片附件，runVideoGen 内如实提示）
        await runVideoGen(text, images.length > 0);
      } else if(images.length){
        // 视觉理解：所选模型不在视觉集合时自动改派 Gemini 3 Pro，注脚据实标注实际模型
        const used = VISION_MODELS.has(usedModelId()) ? usedModelId() : "gemini-3-pro-preview";
        const parts = [{type:"text", text: mergedText}].concat(images.map(im => ({type:"image_url", image_url:{url: im.dataUrl}})));
        await runAPI(text, {model: used, content: parts});
      } else if(docs.length){
        // 纯文档附件：解析文本已并入 mergedText，作为本条 user 消息发送
        await runAPI(text, {content: mergedText});
      } else {
        await runAPI(text);
      }
    }
    else await runDemo(text);
  } finally {
    busy = false; $("#sendBtn").disabled = false; input.focus();
  }
}

$("#attachBtn").addEventListener("click", ()=> $("#fileInput").click());
$("#fileInput").addEventListener("change", async e => {
  const files = Array.from(e.target.files || []);
  const others = [];
  const notices = [];
  for(const f of files){
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    const isSheet = ["xlsx", "xls", "csv"].includes(ext);
    const isText = ["txt", "md", "json"].includes(ext);
    if(f.type && f.type.startsWith("image/")){
      try{
        const dataUrl = await readImageFile(f);
        pendingImages.push({name: f.name, dataUrl});
      }catch(err){ others.push(f.name); }
    } else if(isSheet || isText){
      // 修复2：表格/文本附件真解析（单文件上限 5MB，超限拒绝并提示）
      if(f.size > ATTACH_MAX_BYTES){ notices.push(t("attach_too_big").replace("{name}", f.name)); continue; }
      if(isSheet && !window.XLSX){
        // SheetJS 未加载成功（CDN 失败）：回退为只记文件名，发送时注明未解析，不报错
        pendingDocs.push({name: f.name, kind: "unparsed", text: ""});
      } else if(isSheet){
        try{ pendingDocs.push(await parseSpreadsheetFile(f)); }
        catch(err){ pendingDocs.push({name: f.name, kind: "unparsed", text: ""}); }
      } else {
        try{ pendingDocs.push(await readTextAttach(f)); }
        catch(err){ others.push(f.name); }
      }
    } else {
      // 其他类型仍只显示文件名、发送时不附带
      others.push(f.name);
    }
  }
  renderAttachBar();
  $("#attachName").textContent = notices.concat(others).join("、");
  e.target.value = ""; // 清空以便同一文件可再次选择
});

const FOLLOWUPS = {
  zh:{
    ppt:["换成深色风格","加一页数据图表","压缩到 6 页"],
    sheet:["再按月份汇总一次","把结果做成图表","导出成网页看板"],

    code:["给脚本加上注释说明","改成读取我上传的文件","加一个出错重试"],
    generic:["先给我一个小样看看","换一种交付形式","把要点列成清单"]
  },
  en:{
    ppt:["Make it dark-themed","Add a data chart slide","Trim it to 6 slides"],
    sheet:["Group it by month too","Turn the result into charts","Export it as a web dashboard"],
    report:["Write a shorter summary version","Make the tone more formal","Add an action checklist"],
    web:["Try a different color scheme","Add a pricing section","Make it a dark theme"],
    media:["Try another style","Make it portrait orientation","Change the headline copy"],
    code:["Add explanatory comments","Read my uploaded file instead","Add retry on failure"],
    generic:["Show me a small sample first","Switch the deliverable format","List the key points as a checklist"]
  }
};
function addFollowUps(wrap, intent){
  try{
    const L = FOLLOWUPS[scriptLang()] || FOLLOWUPS.en;
    const list = L[intent] || L.generic;
    if(!list || !list.length) return;
    const row = document.createElement("div");
    row.className = "furow";
    const lab = document.createElement("span");
    lab.className = "fulab"; lab.textContent = t("fu_label");
    row.appendChild(lab);
    list.forEach(q=>{
      const b = document.createElement("button");
      b.type = "button"; b.className = "fuchip"; b.textContent = q;
      b.addEventListener("click", ()=>{ if(busy) return; $("#input").value = q; send(); });
      row.appendChild(b);
    });
    wrap.appendChild(row);
    scrollBottom();
  }catch(e){ /* 追问胶囊是增强项，失败不影响主流程 */ }
}
