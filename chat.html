<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poko Chat — 一句话，做出拿得出手的成果</title>
<style>
:root{
  --ink:#141414; --sub:#6f6f6a; --line:#e8e6e1; --bg:#ffffff; --bg2:#F7F7F5;
  --brand:#FF5C1A; --brand-dark:#e04a0e; --brand-soft:#FFF1E9;
  --shadow:0 10px 34px rgba(20,16,8,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans JP","Noto Sans KR",Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;display:flex}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.mascot{display:inline-block;flex:none}
.mascot svg{display:block}

/* ---------- 侧边栏 ---------- */
aside{width:264px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;height:100vh;position:sticky;top:0}
.logo{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800;padding:2px 6px 14px}
.newchat{display:flex;align-items:center;gap:8px;background:#141414;color:#fff;border:none;border-radius:12px;padding:11px 14px;font-size:14.5px;font-weight:650;width:100%}
.newchat:hover{background:var(--brand)}
.histlabel{font-size:12px;color:var(--sub);font-weight:700;margin:20px 6px 8px}
.hist{display:flex;flex-direction:column;gap:3px}
.hist a{padding:9px 11px;border-radius:10px;font-size:14px;color:#3d3b36;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist a:hover{background:#fff}
.hist a.on{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:13px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffb59e,#FF5C1A);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.side-foot b{font-size:14px;display:block}
.side-foot span{font-size:12px;color:var(--sub)}
.langsel{position:relative;margin-top:12px}
.langsel select{appearance:none;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 26px 8px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.langsel::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--sub);pointer-events:none}

/* ---------- 主区 ---------- */
main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
.topbar{height:52px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;background:#fff}
.modelpick{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:650;background:var(--bg2);border-radius:999px;padding:7px 14px}
.demobadge{background:var(--brand-soft);color:var(--brand-dark);border:1px solid #ffd9c7;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 12px}
.topbar .note{color:var(--sub);font-size:12.5px}
.msgs{flex:1;overflow-y:auto;padding:28px 20px 12px}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column}
.welcome{text-align:center;padding:52px 10px 8px}
.welcome h1{font-size:30px;font-weight:850;letter-spacing:-.01em}
.welcome p{color:var(--sub);margin-top:10px;font-size:15.5px}
.msg-u{align-self:flex-end;background:#141414;color:#fff;border-radius:18px 18px 4px 18px;padding:12px 16px;max-width:80%;font-size:15.5px;margin-top:22px;white-space:pre-wrap;word-break:break-word}
.msg-a{margin-top:22px;max-width:92%}
.steps{border:1px solid var(--line);border-radius:14px;padding:6px 16px;max-width:520px;background:#fff}
.steps .s-head{font-size:13px;color:var(--sub);font-weight:700;padding:8px 0 4px}
.step{display:flex;gap:9px;align-items:center;padding:7px 0;font-size:14.5px;color:#3d3b36;opacity:0;transform:translateY(4px);transition:.3s}
.step.show{opacity:1;transform:none}
.step .tick{width:19px;height:19px;flex:none;border-radius:50%;border:2px solid #d8d5cd;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.step.done .tick{background:#2f9e63;border-color:#2f9e63}
.a-text{margin-top:14px;font-size:15.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.filecard{margin-top:14px;display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:14px;padding:13px 16px;max-width:460px;background:#fff;box-shadow:0 4px 16px rgba(20,16,8,.05)}
.filecard .fic{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.filecard b{font-size:15px;display:block}
.filecard span{color:var(--sub);font-size:13px}
.filecard .dl{margin-left:auto;flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.filecard .dl:hover{border-color:var(--brand);color:var(--brand)}
.preview{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:640px}
.preview .pv-head{background:var(--bg2);font-size:12.5px;color:var(--sub);font-weight:700;padding:8px 14px;border-bottom:1px solid var(--line)}
.preview iframe{width:100%;height:340px;border:none;display:block;background:#fff}
.imgcard{margin-top:14px;max-width:460px;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;color:#fff}
.imgcard .ph{height:250px}
.imgcard .cap{position:absolute;left:14px;bottom:12px;font-weight:750;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.imgcard .tag{position:absolute;top:10px;right:10px;background:rgba(15,15,15,.55);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.costnote{margin-top:12px;font-size:12.5px;color:#a09d94}
.typing{display:inline-flex;gap:5px;margin-top:16px}
.typing i{width:7px;height:7px;border-radius:50%;background:#c9c6bd;animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* ---------- 输入区 ---------- */
.inputzone{flex:none;padding:10px 20px 20px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 26%)}
.inputcol{max-width:820px;margin:0 auto}
.modechips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.chip{border:1px solid transparent;background:var(--bg2);color:#3d3b36;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:#141414;color:#fff}
.chip.free{background:#fff;border-color:var(--line)}
.chip.free.on{background:#141414;color:#fff}
.composer{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px 10px}
.composer textarea{width:100%;border:none;resize:none;font-family:inherit;font-size:16px;line-height:1.5;min-height:46px;outline:none;color:var(--ink);background:transparent}
.composer textarea::placeholder{color:#a9a69d}
.composer .tools{display:flex;align-items:center;gap:10px}
.plusbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:19px;line-height:1;color:#44423c}
.plusbtn:hover{border-color:var(--brand);color:var(--brand)}
.sendbtn{margin-left:auto;width:40px;height:40px;border-radius:50%;border:none;background:#141414;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.sendbtn:hover{background:var(--brand)}
.sendbtn:disabled{opacity:.35;cursor:default}
.hint{text-align:center;color:#a09d94;font-size:12px;margin-top:10px}
@media(max-width:820px){ aside{display:none} .msg-u{max-width:92%} }
</style>
</head>
<body>
<aside>
  <a class="logo" href="index.html">
    <span class="mascot"><svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true"><path d="M25 6c1-3.4 4.4-4.8 7.6-3.8C31.6 5.6 29.4 7.6 26 7.8z" fill="#3C9A5F"/><circle cx="24" cy="26" r="19" fill="#FF5C1A"/><circle cx="17.5" cy="24" r="2.7" fill="#26221e"/><circle cx="30.5" cy="24" r="2.7" fill="#26221e"/><circle cx="18.4" cy="23" r=".9" fill="#fff"/><circle cx="31.4" cy="23" r=".9" fill="#fff"/><ellipse cx="13.8" cy="30" rx="3.4" ry="2.1" fill="#FFB59E"/><ellipse cx="34.2" cy="30" rx="3.4" ry="2.1" fill="#FFB59E"/><path d="M20 30.5q4 3.2 8 0" stroke="#7A2A08" stroke-width="2.1" fill="none" stroke-linecap="round"/></svg></span>
    Poko
  </a>
  <button class="newchat" id="newChatBtn" type="button">＋ <span data-i18n="new_chat">新对话</span></button>
  <div class="histlabel" data-i18n="history">历史对话</div>
  <nav class="hist">
    <a href="#" class="on" data-i18n="hist1">季度销售复盘 PPT</a>
    <a href="#" data-i18n="hist2">课程问卷数据分析</a>
    <a href="#" data-i18n="hist3">桂花乌龙上市海报</a>
  </nav>
  <div class="langsel">
    <select id="langSel" aria-label="Language">
      <option value="zh">简体中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="es">Español</option>

  </div>
  <div class="side-foot">
    <div class="avatar">访</div>
    <div><b data-i18n="guest">演示访客</b><span data-i18n="guest_sub">免费试用中</span></div>
  </div>
</aside>

<main>
  <div class="topbar">
    <span class="modelpick">✦ <span data-i18n="model_smart">智能优选</span> ▾</span>
    <span class="demobadge" data-i18n="demo_badge">演示模式</span>
    <span class="note" data-i18n="demo_note">接入真实模型后自动切换</span>
  </div>
  <div class="msgs" id="msgs">
    <div class="col" id="msgCol">
      <div class="welcome" id="welcome">
        <h1 data-i18n="welcome_title">想做点什么？说一句话就行</h1>
        <p data-i18n="welcome_sub">PPT、报告、表格、海报、网页、代码——描述清楚要什么，Poko 把成品文件交给你。</p>
      </div>
    </div>
  </div>
  <div class="inputzone">
    <div class="inputcol">
      <div class="modechips" id="modeChips"></div>
      <div class="composer">
        <textarea id="input" rows="2" data-i18n-ph="input_ph" placeholder="描述你要做的事，例如：把这份销售数据做成 10 页汇报 PPT"></textarea>
        <div class="tools">
          <button class="plusbtn" type="button" id="attachBtn" aria-label="Upload">＋</button>
          <input type="file" id="fileInput" hidden multiple>
          <span style="font-size:13px;color:var(--sub)" id="attachName"></span>
          <button class="sendbtn" type="button" id="sendBtn" aria-label="Send">↑</button>
        </div>
      </div>
      <p class="hint" data-i18n="hint">演示模式下不会调用真实模型，产出文件为示例内容。</p>
    </div>
  </div>
</main>

  + "## 第 1 页 · 封面\n- 标题 + 副标题 + 汇报人/日期\n\n"
  + "## 第 2 页 · 目录\n- 背景 / 核心结论 / 数据拆解 / 问题与风险 / 行动计划\n\n"

  + "## 第 5 页 · 整体数据概览\n- 核心指标卡 + 趋势图\n\n"

  + "## 第 7 页 · 问题拆解\n- 掉队板块与根因假设\n\n"

function buildReport(promptText){
  return "# 报告（演示示例）\n\n主题：" + (promptText || "未命名主题") + "\n\n"
  + "## 摘要\n本报告围绕上述主题，先给出核心结论，再展开依据与建议。演示模式下为示例结构，接入真实模型后将基于你的材料生成完整正文。\n\n"
  + "## 一、背景\n说明主题的来源、现状与为什么值得关注，交代数据与信息的口径。\n\n"

function buildScript(){
  return "# -*- coding: utf-8 -*-\n\"\"\"Poko 生成的示例脚本：统计 CSV 中各区域的销售额。\n用法：python poko_script.py sales.csv\n\"\"\"\nimport csv, sys\nfrom collections import defaultdict\n\ndef main(path):\n    totals = defaultdict(float)\n    with open(path, newline='', encoding='utf-8') as f:\n        for row in csv.DictReader(f):\n            totals[row['区域']] += float(row['销售额(元)'])\n    for region, amount in sorted(totals.items(), key=lambda kv: -kv[1]):\n        print(f'{region}: {amount:,.0f} 元')\n\nif __name__ == '__main__':\n    main(sys.argv[1] if len(sys.argv) > 1 else 'sales.csv')\n";
}

/* ================= 状态与语言 ================= */
let lang = localStorage.getItem("poko_lang") || "zh";
if(!I18N[lang]) lang = "zh";
const $ = s => document.querySelector(s);
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.zh[k] || k;
let currentMode = "free";
let busy = false;
const historyMsgs = []; // 真实 API 模式下的上下文

function applyLang(){
  document.documentElement.lang = {zh:"zh-CN", en:"en", ja:"ja", ko:"ko", es:"es"}[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $("#langSel").value = lang;
  renderModes();
}
function renderModes(){
  $("#modeChips").innerHTML = t("modes").map(([label, m], i)=>
    `<button type="button" class="chip${i===0 ? " free" : ""}${m===currentMode ? " on" : ""}" data-mode="${m}">${label}</button>`).join("");
  document.querySelectorAll("#modeChips .chip").forEach(c => c.addEventListener("click", ()=>{
    currentMode = c.dataset.mode; renderModes(); $("#input").focus();
  }));
}

/* ================= 意图识别 ================= */
function detectIntent(text){
  const modeMap = {report:"report", sheet:"sheet", ppt:"ppt", video:"media", image:"media", code:"code"};
  if(currentMode !== "free" && modeMap[currentMode]) return modeMap[currentMode];
  const s = text.toLowerCase();
  const has = arr => arr.some(w => s.includes(w));
  if(has(["网页","网站","落地页","看板","页面","web page","website","landing","dashboard"])) return "web";
  if(has(["ppt","演示","幻灯片","slides","deck","presentation","powerpoint"])) return "ppt";
  if(has(["海报","图片","图像","视频","短片","poster","image","video","picture"])) return "media";
  if(has(["表格","数据","分析","统计","excel","csv","spreadsheet","data","analy"])) return "sheet";
  if(has(["脚本","代码","程序","script","code","python"])) return "code";
  if(has(["报告","文档","写","report","document","write","essay"])) return "report";
  return "generic";
}

/* ================= 消息渲染 ================= */
function scrollBottom(){ const m = $("#msgs"); m.scrollTop = m.scrollHeight; }
function hideWelcome(){ const w = $("#welcome"); if(w) w.remove(); }
function addUserMsg(text){
  hideWelcome();
  const d = document.createElement("div");
  d.className = "msg-u"; d.textContent = text;
  $("#msgCol").appendChild(d); scrollBottom();
}
function addAgentShell(){
  const wrap = document.createElement("div");
  wrap.className = "msg-a";
  wrap.innerHTML = `<div class="typing" aria-label="thinking"><i></i><i></i><i></i></div>`;
  $("#msgCol").appendChild(wrap); scrollBottom();
  return wrap;
}
function addCostNote(parent){
  const n = document.createElement("div");
  n.className = "costnote"; n.textContent = t("cost_note");
  parent.appendChild(n);
}
function downloadBtn(name, content, mime){
  const blob = new Blob([content], {type: mime + ";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.className = "dl"; a.textContent = t("dl");
  return a;
}
function addFileCard(parent, icon, name, meta, dlEl){
  const card = document.createElement("div");
  card.className = "filecard";
  card.innerHTML = `<div class="fic">${icon}</div><div><b></b><span></span></div>`;
  card.querySelector("b").textContent = name;
  card.querySelector("span").textContent = meta;
  if(dlEl) card.appendChild(dlEl);
  parent.appendChild(card);
}
function typeText(el, text, done){
  let i = 0;
  const iv = setInterval(()=>{
    i += 2 + Math.floor(Math.random()*3);
    el.textContent = text.slice(0, i);
    scrollBottom();
    if(i >= text.length){ clearInterval(iv); if(done) done(); }
  }, 18);
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================= 演示 Agent ================= */
async function runDemo(text){
  const intent = detectIntent(text);
  const sc = SCRIPTS[scriptLang()][intent];
  const wrap = addAgentShell();
  await wait(650);
  // 步骤行
  const stepsBox = document.createElement("div");
  stepsBox.className = "steps";
  stepsBox.innerHTML = `<div class="s-head">${t("steps_done")}</div>` + sc.steps.map(s =>
    `<div class="step"><span class="tick">✓</span><span>${s}</span></div>`).join("");
  wrap.innerHTML = ""; wrap.appendChild(stepsBox); scrollBottom();
  const stepEls = Array.from(stepsBox.querySelectorAll(".step"));
  for(const s of stepEls){
    s.classList.add("show"); await wait(600); s.classList.add("done");
  }
  await wait(300);
  // 回复正文（流式打字）
  const body = document.createElement("div");
  body.className = "a-text"; wrap.appendChild(body);
  await new Promise(res => typeText(body, sc.reply, res));
  // 产出物
  if(intent === "web"){
    const html = buildWebPage(text);
    const blobUrl = URL.createObjectURL(new Blob([html], {type:"text/html;charset=utf-8"}));
    const pv = document.createElement("div");
    pv.className = "preview";
    pv.innerHTML = `<div class="pv-head">${t("preview")}</div><iframe title="preview"></iframe>`;
    pv.querySelector("iframe").src = blobUrl;
    wrap.appendChild(pv);
    addFileCard(wrap, "🌐", "poko-page.html", lang === "zh" ? "网页 · 单文件" : "Web page · single file",
      downloadBtn("poko-page.html", html, "text/html"));
  } else if(intent === "ppt"){
    addFileCard(wrap, "📊", lang === "zh" ? "演示文稿.pptx（演示占位）" : "presentation.pptx (demo placeholder)",
      lang === "zh" ? "下载得到 Markdown 大纲" : "Download gives a Markdown outline",
      downloadBtn("presentation-outline.md", buildPptOutline(text), "text/markdown"));
  } else if(intent === "sheet"){
    addFileCard(wrap, "📈", "sales-summary.csv", lang === "zh" ? "表格 · 示例数据" : "Spreadsheet · sample data",
      downloadBtn("sales-summary.csv", buildCsv(), "text/csv"));
  } else if(intent === "report"){
    addFileCard(wrap, "📄", "report.md", lang === "zh" ? "文档 · Markdown" : "Document · Markdown",
      downloadBtn("report.md", buildReport(text), "text/markdown"));
  } else if(intent === "media"){
    const g = ["linear-gradient(140deg,#f2709c,#ff9472)","linear-gradient(140deg,#654ea3,#eaafc8)","linear-gradient(140deg,#11998e,#38ef7d)","linear-gradient(140deg,#f7971e,#ffd200)"][Math.floor(Math.random()*4)];
    const card = document.createElement("div");
    card.className = "imgcard";
    card.innerHTML = `<div class="ph" style="background:${g}"></div><span class="tag">${t("img_tag")}</span><span class="cap">${text.slice(0, 26)}</span>`;
    wrap.appendChild(card);
  } else if(intent === "code"){
    addFileCard(wrap, "🐍", "poko_script.py", lang === "zh" ? "脚本 · Python" : "Script · Python",
      downloadBtn("poko_script.py", buildScript(), "text/x-python"));
  }
  addCostNote(wrap);
  scrollBottom();
}

/* ================= 真实 API 模式（POKO_API_BASE 非空时） ================= */
async function runAPI(text){
  historyMsgs.push({role:"user", content:text});
  const wrap = addAgentShell();
  const body = document.createElement("div");
  body.className = "a-text";
  try{
    const res = await fetch(POKO_API_BASE.replace(/\/+$/,"") + "/api/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({messages: historyMsgs})
    });
    if(!res.ok || !res.body) throw new Error("bad response");
    wrap.innerHTML = ""; wrap.appendChild(body);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", full = "";
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for(const line of lines){
        const s = line.trim();
        if(!s.startsWith("data:")) continue;
        const data = s.slice(5).trim();
        if(data === "[DONE]") continue;
        try{
          const j = JSON.parse(data);
          const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if(delta){ full += delta; body.textContent = full; scrollBottom(); }
        }catch(e){ /* 忽略不完整的 SSE 分片 */ }
      }
    }
    if(!full) throw new Error("empty stream");
    historyMsgs.push({role:"assistant", content:full});
  }catch(e){
    // 请求失败 → 回退演示模式，保证体验不断
    historyMsgs.pop();
    wrap.remove();
    await runDemo(text);
    return;
  }
  addCostNote(wrap);
  scrollBottom();
}

/* ================= 发送流程 ================= */
async function send(){
  if(busy) return;
  const input = $("#input");
  const text = input.value.trim();
  if(!text) return;
  busy = true; $("#sendBtn").disabled = true;
  input.value = "";
  addUserMsg(text);
  try{
    if(POKO_API_BASE) await runAPI(text);
    else await runDemo(text);
  } finally {
    busy = false; $("#sendBtn").disabled = false; input.focus();
  }
}
$("#sendBtn").addEventListener("click", send);
$("#input").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("#newChatBtn").addEventListener("click", ()=> location.href = "chat.html");
$("#langSel").addEventListener("change", e => {
  lang = e.target.value;
  localStorage.setItem("poko_lang", lang);
  applyLang();
});
$("#attachBtn").addEventListener("click", ()=> $("#fileInput").click());
$("#fileInput").addEventListener("change", e => {
  const names = Array.from(e.target.files).map(f => f.name);
  $("#attachName").textContent = names.join("、");
});

/* ================= 初始化：语言 + URL 参数 ================= */
applyLang();
(function initFromURL(){
  const p = new URLSearchParams(location.search);
  const mode = p.get("mode");
  if(mode && t("modes").some(([, m]) => m === mode)){ currentMode = mode; renderModes(); }
  const q = p.get("q");
  if(q){
    $("#input").value = q;
    setTimeout(send, 450);
  }
})();
